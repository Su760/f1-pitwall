name: F0a checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: pitwall scenarios/synthetic.json --trace-dir traces
